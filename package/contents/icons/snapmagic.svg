<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="SnapMagic logo">
  <defs>
    <!-- Homogeneous 45-degree gradients. No waves, surface lines or patterns. -->
    <linearGradient id="leftGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#65E2FD"/>
      <stop offset="42%" stop-color="#269FFC"/>
      <stop offset="100%" stop-color="#2866E9"/>
    </linearGradient>
    <linearGradient id="topGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8D16F5"/>
      <stop offset="43%" stop-color="#EC27C8"/>
      <stop offset="78%" stop-color="#FF8B79"/>
      <stop offset="100%" stop-color="#FFC64C"/>
    </linearGradient>
    <linearGradient id="bottomGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#078CBE"/>
      <stop offset="48%" stop-color="#08C7CB"/>
      <stop offset="100%" stop-color="#53E5B3"/>
    </linearGradient>
    <linearGradient id="magnetGradient" x1="0%" y1="45%" x2="100%" y2="55%">
      <stop offset="0%" stop-color="#30E2FF"/>
      <stop offset="37%" stop-color="#217BF6"/>
      <stop offset="61%" stop-color="#E91AD2"/>
      <stop offset="100%" stop-color="#FF7862"/>
    </linearGradient>
    <linearGradient id="magnetCap" x1="0%" y1="0%" x2="8%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5F5FF"/>
    </linearGradient>
    <linearGradient id="cornerGradient" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFAE3B"/>
      <stop offset="50%" stop-color="#FF625B"/>
      <stop offset="100%" stop-color="#DF24D6"/>
    </linearGradient>
    <clipPath id="magnetClip">
      <path d="M 356,349 Q 356,329 377,329 H 422 Q 443,329 443,349 V 512 C 443,544 466,568 499,568 C 532,568 555,544 555,512 V 349 Q 555,329 576,329 H 621 Q 642,329 642,349 V 512 C 642,592 579,655 499,655 C 419,655 356,592 356,512 Z"/>
    </clipPath>
    <filter id="magnetShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="11" result="blur"/>
      <feOffset in="blur" dx="0" dy="13" result="offsetBlur"/>
      <feComponentTransfer in="offsetBlur" result="softShadow">
        <feFuncA type="linear" slope="0.30"/>
      </feComponentTransfer>
      <feMerge><feMergeNode in="softShadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Half-width left pane -->
  <rect x="40" y="40" width="464" height="944" rx="77" fill="url(#leftGradient)"/>

  <!-- Top right quarter: magenta to yellow, opposite diagonal -->
  <rect x="519" y="40" width="465" height="456" rx="73" fill="url(#topGradient)"/>

  <!-- Bottom right quarter: turquoise and mint at 45 degrees -->
  <rect x="519" y="511" width="465" height="473" rx="73" fill="url(#bottomGradient)"/>

  <!-- Corner positioning mark: orange through magenta (no white) -->
  <path d="M 784 918 C 784 826 855 764 939 764" fill="none" stroke="url(#cornerGradient)" stroke-width="21" stroke-linecap="round"/>
  <circle cx="902" cy="886" r="31" fill="url(#cornerGradient)"/>

  <!-- Central snapping magnet, poles pointing up -->
  <g filter="url(#magnetShadow)">
    <path d="M 356,349 Q 356,329 377,329 H 422 Q 443,329 443,349 V 512 C 443,544 466,568 499,568 C 532,568 555,544 555,512 V 349 Q 555,329 576,329 H 621 Q 642,329 642,349 V 512 C 642,592 579,655 499,655 C 419,655 356,592 356,512 Z" fill="url(#magnetGradient)" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="3"/>
    <g clip-path="url(#magnetClip)">
      <rect x="353" y="327" width="94" height="80" fill="url(#magnetCap)"/>
      <rect x="553" y="327" width="92" height="80" fill="url(#magnetCap)"/>
    </g>
  </g>
</svg>
